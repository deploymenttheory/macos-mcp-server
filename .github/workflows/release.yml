# Builds and validates both local distribution formats before publishing a
# release-please draft. The tap is updated only after the release is public.
#
# release-please owns the version, the changelog and the GitHub release
# itself; this only builds the artifacts and appends them. A failure here
# leaves the release intact rather than half-made, and it can be re-run
# without re-tagging.
#
# Signing and notarization are mandatory. Every secret below must be present;
# the job fails loudly rather than falling back to an ad-hoc signature,
# because TCC grants are keyed on the signing identity and an ad-hoc binary
# would make every user re-grant Accessibility on every update.
name: release

on:
  push:
    tags:
      - "v*"
  # Rebuild an existing tag with the workflow as it is on the default
  # branch, for when a release run failed on a workflow bug: a re-run would
  # replay the broken file, and a moved tag is a rewritten release.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build, e.g. v0.1.1"
        required: true

permissions:
  contents: read

jobs:
  goreleaser:
    name: 📦 Build, verify and publish
    runs-on: xcode-27
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    permissions:
      contents: write  # attach the archives to the release
      id-token: write  # keyless cosign: the signature names this workflow
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      # Outside the checkout: security(1) writes lock files beside the
      # keychain, and goreleaser refuses to release from a dirty tree. Set
      # here because the runner context is not available in a job-level env.
      - name: Choose the keychain path
        run: echo "KEYCHAIN_PATH=$RUNNER_TEMP/release-signing.keychain-db" >> "$GITHUB_ENV"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install the pinned MCPB packer
        run: npm install --global --no-audit --no-fund @anthropic-ai/mcpb@2.1.2

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Require the signing and notarization secrets
        env:
          P12: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          missing=()
          for v in P12 P12_PASSWORD IDENTITY KEY_ID ISSUER KEY_P8 TAP_TOKEN; do
            if [ -z "${!v}" ]; then missing+=("$v"); fi
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::release secrets missing: ${missing[*]}; a release is never cut unsigned"
            exit 1
          fi

      - name: Refuse to rebuild a public release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # A tag push can reach Actions before release-please has finished
          # creating its draft. Wait for that draft, but never touch a public
          # release or create a second release ourselves.
          for attempt in {1..12}; do
            if state=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
              if [ "$state" = true ]; then exit 0; fi
              echo "::error::$RELEASE_TAG is already public; publish a new version instead of replacing its assets"
              exit 1
            fi
            echo "Waiting for the release-please draft ($attempt/12)"
            sleep 5
          done
          echo "::error::release-please did not create a draft for $RELEASE_TAG"
          exit 1

      - name: Import the Developer ID certificate into a temporary keychain
        env:
          P12: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PASSWORD=$(openssl rand -hex 24)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          CERT="$RUNNER_TEMP/developer-id.p12"
          echo "$P12" | base64 --decode > "$CERT"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          # Older Apple-exported P12 files use RC2-40-CBC. OpenSSL 3 only
          # loads that cipher when its legacy provider is enabled.
          openssl pkcs12 -legacy -in "$CERT" -clcerts -nokeys -passin env:P12_PASSWORD \
            -out "$RUNNER_TEMP/mcpb-cert.pem"
          openssl pkcs12 -legacy -in "$CERT" -nocerts -nodes -passin env:P12_PASSWORD \
            -out "$RUNNER_TEMP/mcpb-key.pem"
          chmod 600 "$RUNNER_TEMP/mcpb-key.pem"
          rm -f "$CERT"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}

      - name: Pack, sign and upload the Claude Desktop bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#v}
          archive="dist/macos-mcp-server_${version}_darwin_arm64.tar.gz"
          mkdir -p "$RUNNER_TEMP/release-binary"
          tar -xzf "$archive" -C "$RUNNER_TEMP/release-binary" macos-mcp-server
          binary="$RUNNER_TEMP/release-binary/macos-mcp-server"
          bundle="dist/macos-mcp-server_${version}_darwin_arm64.mcpb"
          scripts/package-mcpb.sh "$binary" "$version" "$bundle"
          python3 scripts/mcpb-signature.py sign "$bundle" --cert "$RUNNER_TEMP/mcpb-cert.pem" \
            --key "$RUNNER_TEMP/mcpb-key.pem"
          python3 scripts/mcpb-signature.py verify "$bundle" --cert "$RUNNER_TEMP/mcpb-cert.pem"
          security verify-cert -c "$RUNNER_TEMP/mcpb-cert.pem" -p codeSign
          (cd dist && shasum -a 256 "$(basename "$bundle")") > "$bundle.sha256"
          cosign sign-blob --bundle "$bundle.sigstore.json" "$bundle" --yes
          cosign verify-blob --bundle "$bundle.sigstore.json" \
            --certificate-identity "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/.github/workflows/release.yml@$GITHUB_REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com "$bundle"
          gh release upload "$RELEASE_TAG" "$bundle" "$bundle.sha256" \
            "$bundle.sigstore.json" --clobber

      - name: Verify the staged release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#v}
          binary="$RUNNER_TEMP/release-binary/macos-mcp-server"
          (cd dist && shasum -a 256 -c "macos-mcp-server_${version}_checksums.txt")
          codesign --verify --strict --verbose=2 "$binary"
          spctl -a -vv -t install "$binary"
          test "$("$binary" --version)" = "macos-mcp-server version $version"
          python3 scripts/smoke-stdio.py "$binary" "$version"
          python3 scripts/mcpb-signature.py verify \
            "dist/macos-mcp-server_${version}_darwin_arm64.mcpb" \
            --cert "$RUNNER_TEMP/mcpb-cert.pem"
          .github/scripts/check-cask.sh dist/homebrew/Casks/macos-mcp-server.rb
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true

      - name: Publish the verified preview release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$RELEASE_TAG" --draft=false --prerelease=true

      - name: Install through the generated Homebrew cask
        run: |
          .github/scripts/check-cask.sh dist/homebrew/Casks/macos-mcp-server.rb --install
          test "$(macos-mcp-server --version)" = "macos-mcp-server version ${RELEASE_TAG#v}"

      - name: Publish the Homebrew cask
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: .github/scripts/publish-cask.sh dist/homebrew/Casks/macos-mcp-server.rb "${RELEASE_TAG#v}"

      - name: Download the pinned MCP Registry publisher
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v1.8.1 --repo modelcontextprotocol/registry \
            --pattern mcp-publisher_darwin_arm64.tar.gz --dir "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/mcp-publisher_darwin_arm64.tar.gz" -C "$RUNNER_TEMP" mcp-publisher
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Publish the bundle to the MCP Registry
        continue-on-error: true # The separate workflow retries a Registry outage without rebuilding public assets.
        run: |
          version=${RELEASE_TAG#v}
          .github/scripts/publish-registry.sh "$RELEASE_TAG" \
            "dist/macos-mcp-server_${version}_darwin_arm64.mcpb"

      - name: Remove the temporary keychain
        if: always()
        run: |
          security list-keychains -d user -s login.keychain-db
          security delete-keychain "$KEYCHAIN_PATH" || true
          rm -f "$RUNNER_TEMP/mcpb-cert.pem" "$RUNNER_TEMP/mcpb-key.pem"
