name: mcp | Spec Compliance

# Proves this server conforms to the Model Context Protocol, and keeps that
# proof current as the spec evolves. The verdict comes from the official
# suite, github.com/modelcontextprotocol/conformance, run against the server
# itself: it is not self-assessed.
#
# The suite can only reach a server over HTTP, so the job builds the server
# with `-tags conformance`, which adds a loopback Streamable HTTP host and
# nothing else. TestConformanceHostServesTheShippedSurface asserts that host
# serves a manifest and capabilities identical to the stdio binary.
#
# Three passes, recorded separately: product (the shipped manifest), fixtures
# (the suite's named fixtures registered, so handlers are exercised), and a
# 2025-11-25 backward-compatibility run.

on:
  workflow_dispatch:
  schedule:
    # Mondays 06:17 UTC. Off the hour to avoid the scheduler's peak-minute backlog.
    - cron: '17 6 * * 1'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/mcp-spec-compliance.yml'
      - '.github/scripts/run-conformance-pass.sh'
      - 'conformance/**'
      - 'schema/**'
      - 'internal/macmcp/**'
      - 'pkg/macos/**'
      - 'go.mod'

permissions:
  contents: read

env:
  # Pinned exactly: a pre-release harness must not float, or the verdict is
  # not reproducible. The "newer harness" step reports rather than adopts.
  HARNESS_VERSION: '0.2.0-alpha.10'
  SPEC_VERSION: '2026-07-28'
  BACKCOMPAT_SPEC_VERSION: '2025-11-25'
  PRODUCT_PORT: '3001'
  FIXTURES_PORT: '3002'
  BACKCOMPAT_PORT: '3003'

jobs:
  conformance:
    name: '📐 Official MCP conformance suite'
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: write        # push the evidence branch
      pull-requests: write   # open the evidence PR
      issues: write          # open the tracking issue
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # PR runs report only; they must not push branches or file issues.
      MUTATE: ${{ github.event_name != 'pull_request' }}

    steps:
      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'
          cache: true

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Build the conformance host
        run: |
          set -euo pipefail
          # The `conformance` tag adds the loopback HTTP host. A plain build
          # must NOT contain it: that is the guarantee that the released
          # binary is stdio-only.
          go build -tags conformance -o "$RUNNER_TEMP/conformance-host" ./cmd/macos-mcp-server
          go build -o "$RUNNER_TEMP/released" ./cmd/macos-mcp-server
          if "$RUNNER_TEMP/released" --help 2>&1 | grep -q conformance-serve; then
            echo '::error::conformance-serve is present in an untagged build; the release binary must have no HTTP listener'
            exit 1
          fi
          echo 'release binary has no conformance-serve subcommand'

      - name: Assert the host serves the shipped surface
        # If this fails, nothing below is evidence about the shipped server.
        run: go test -tags conformance ./internal/macmcp/ -run 'ConformanceHost|ConformanceFixtures|MRTR' -count=1 -v

      # Each pass starts its own host, runs the suite against it and stops it
      # again, inside one step, via .github/scripts/run-conformance-pass.sh.
      - name: Run the suite — product pass
        id: product
        continue-on-error: true
        run: >
          .github/scripts/run-conformance-pass.sh
          --name product
          --host-bin "$RUNNER_TEMP/conformance-host"
          --port "$PRODUCT_PORT"
          --spec-version "$SPEC_VERSION"
          --harness-version "$HARNESS_VERSION"
          --baseline conformance/baseline-product.yml
          --output-dir "$RUNNER_TEMP/results/product"
          --log-dir "$RUNNER_TEMP"

      - name: Run the suite — fixtures pass
        id: fixtures
        continue-on-error: true
        run: >
          .github/scripts/run-conformance-pass.sh
          --name fixtures --fixtures
          --host-bin "$RUNNER_TEMP/conformance-host"
          --port "$FIXTURES_PORT"
          --spec-version "$SPEC_VERSION"
          --harness-version "$HARNESS_VERSION"
          --baseline conformance/baseline-fixtures.yml
          --output-dir "$RUNNER_TEMP/results/fixtures"
          --log-dir "$RUNNER_TEMP"

      - name: Run the suite — 2025-11-25 backward compatibility
        id: backcompat
        continue-on-error: true
        run: >
          .github/scripts/run-conformance-pass.sh
          --name backcompat --fixtures
          --host-bin "$RUNNER_TEMP/conformance-host"
          --port "$BACKCOMPAT_PORT"
          --spec-version "$BACKCOMPAT_SPEC_VERSION"
          --harness-version "$HARNESS_VERSION"
          --baseline conformance/baseline-backcompat.yml
          --output-dir "$RUNNER_TEMP/results/backcompat"
          --log-dir "$RUNNER_TEMP"

      - name: Collect the evidence
        run: |
          set -euo pipefail
          mkdir -p conformance/results
          # The suite writes each run to results/server-<scenario>-<timestamp>/checks.json.
          # Merge a pass's runs into one checks.json so the committed evidence
          # is one file per pass rather than a directory tree keyed by time.
          merge() {
            local from=$1 to=$2
            if [ -z "$(find "$from" -name checks.json | head -n 1)" ]; then
              echo "no checks.json produced under $from" >&2; exit 1
            fi
            find "$from" -name checks.json -print0 | sort -z |
              xargs -0 jq -s 'map(if type == "array" then . else [.] end) | add' > "$to"
            echo "$to <- $(jq length "$to") checks"
          }
          merge "$RUNNER_TEMP/results/product"    conformance/results/product-checks.json
          merge "$RUNNER_TEMP/results/fixtures"   conformance/results/fixtures-checks.json
          merge "$RUNNER_TEMP/results/backcompat" conformance/results/backcompat-checks.json

      - name: Render the compliance report
        run: |
          set -euo pipefail
          stamp=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          for fmt_out in "markdown docs/mcp-compliance.md" "json conformance/results/report.json"; do
            set -- $fmt_out
            go run ./cmd/macos-mcp-server conformance-report \
              --pass "product=conformance/results/product-checks.json" \
              --pass "fixtures=conformance/results/fixtures-checks.json" \
              --spec-version "$SPEC_VERSION" --harness-version "$HARNESS_VERSION" \
              --baseline-product conformance/baseline-product.yml \
              --baseline-fixtures conformance/baseline-fixtures.yml \
              --commit '${{ github.sha }}' --generated-at "$stamp" --run-url "$run_url" \
              --format "$1" --out "$2" \
              --badge-out conformance/badge.json --badge-pass product
          done

      - name: Job summary
        run: cat docs/mcp-compliance.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: conformance-results
          path: |
            conformance/results/
            ${{ runner.temp }}/*.err

      - name: Check for a newer spec revision
        id: sync
        # Informational: vendors any newly published schema and reports it. A
        # transient API failure must not strand the gate below.
        continue-on-error: true
        run: |
          set -euo pipefail
          manifest=schema/versions.json
          known=$(jq -r '.versions[]' "$manifest")
          # 'draft' churns continuously and is deliberately not vendored.
          upstream=$(gh api repos/modelcontextprotocol/modelcontextprotocol/contents/schema \
            --jq '.[] | select(.type == "dir") | .name' | grep -E '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' | sort)
          if [ -z "$upstream" ]; then echo 'upstream returned no revision directories' >&2; exit 1; fi
          new=""
          for v in $upstream; do
            if ! grep -qx "$v" <<<"$known"; then
              mkdir -p "schema/$v"
              curl -fsSL "https://raw.githubusercontent.com/modelcontextprotocol/modelcontextprotocol/main/schema/$v/schema.json" \
                -o "schema/$v/schema.json"
              new="${new:+$new,}$v"
            fi
          done
          if [ -n "$new" ]; then
            jq --argjson vs "$(printf '%s\n' $upstream | jq -R . | jq -s .)" '.versions = $vs' "$manifest" > "$manifest.tmp"
            mv "$manifest.tmp" "$manifest"
          fi
          echo "new_versions=$new" >> "$GITHUB_OUTPUT"
          echo "newest=$(printf '%s\n' $upstream | tail -n 1)" >> "$GITHUB_OUTPUT"

      - name: Check for a newer conformance harness
        id: harness
        continue-on-error: true
        run: |
          set -euo pipefail
          alpha=$(npm view '@modelcontextprotocol/conformance' dist-tags.alpha 2>/dev/null || true)
          latest=$(npm view '@modelcontextprotocol/conformance' dist-tags.latest 2>/dev/null || true)
          echo "current: $HARNESS_VERSION / latest: $latest / alpha: $alpha"
          newer=""
          if [ -n "$alpha" ] && [ "$alpha" != "$HARNESS_VERSION" ]; then newer=$alpha; fi
          echo "newer=$newer" >> "$GITHUB_OUTPUT"

      - name: Gate on the suite's verdict
        # Last, so the evidence is always collected, rendered and uploaded
        # even when the verdict is bad. The suite's own exit code is the gate.
        run: |
          failed=()
          [ '${{ steps.product.outcome }}' = 'success' ]    || failed+=(product)
          [ '${{ steps.fixtures.outcome }}' = 'success' ]   || failed+=(fixtures)
          [ '${{ steps.backcompat.outcome }}' = 'success' ] || failed+=('backcompat (2025-11-25)')
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::conformance suite reported unexpected results for: ${failed[*]}. See docs/mcp-compliance.md and the uploaded artifact."
            exit 1
          fi
          echo 'all passes matched their baselines'

      - name: Commit the evidence
        if: env.MUTATE == 'true' && always()
        run: |
          set -euo pipefail
          git add conformance docs/mcp-compliance.md schema
          if git diff --cached --quiet; then echo 'nothing changed'; exit 0; fi
          new_versions='${{ steps.sync.outputs.new_versions }}'
          branch="chore/mcp-conformance-${{ github.run_id }}"
          if [ -n "$new_versions" ]; then title="chore: vendor MCP schema revision(s) $new_versions"
          else title='chore: refresh MCP conformance evidence'; fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git checkout -b "$branch"
          git commit -m "$title" -m 'Automated by .github/workflows/mcp-spec-compliance.yml.'
          git push --set-upstream origin "$branch"
          vendored='_none_'
          if [ -n "$new_versions" ]; then vendored="\`$new_versions\`"
          elif [ '${{ steps.sync.outcome }}' != 'success' ]; then vendored='_could not check_'; fi
          newest='${{ steps.sync.outputs.newest }}'
          if [ -n "$newest" ]; then newest_line="\`$newest\`"; else newest_line='_could not check_'; fi
          body="$RUNNER_TEMP/pr-body.md"
          {
            echo 'Automated MCP conformance run.'
            echo
            echo "- Suite: \`@modelcontextprotocol/conformance@$HARNESS_VERSION\`"
            echo "- Spec revision: \`$SPEC_VERSION\` (plus \`$BACKCOMPAT_SPEC_VERSION\` for backward compatibility)"
            echo "- New revision(s) vendored: $vendored"
            echo "- Newest published upstream: $newest_line"
            echo
            echo 'Per-scenario results are in `docs/mcp-compliance.md`; raw `checks.json` output is under `conformance/results/`.'
          } > "$body"
          gh pr create --title "$title" --body-file "$body" --base '${{ github.ref_name }}' --head "$branch"

      - name: Open or update the tracking issue
        if: env.MUTATE == 'true' && always() && (steps.sync.outputs.new_versions != '' || steps.harness.outputs.newer != '' || failure())
        run: |
          set -euo pipefail
          marker='mcp-spec-compliance'
          title='MCP conformance: action needed'
          new_versions='${{ steps.sync.outputs.new_versions }}'
          new_harness='${{ steps.harness.outputs.newer }}'
          newest='${{ steps.sync.outputs.newest }}'
          cell() { if [ -n "$1" ]; then echo "\`$1\`"; else echo "$2"; fi; }
          new_cell=$(cell "$new_versions" '_none_')
          harness_cell=$(cell "$new_harness" '_none_')
          newest_cell=$(cell "$newest" '_could not check_')
          [ '${{ steps.sync.outcome }}' = 'success' ]    || new_cell='_could not check_'
          [ '${{ steps.harness.outcome }}' = 'success' ] || harness_cell='_could not check_'
          body="$RUNNER_TEMP/issue-body.md"
          {
            echo "<!-- $marker -->"
            echo 'Automated by `.github/workflows/mcp-spec-compliance.yml` (run ${{ github.run_id }}).'
            echo
            echo '| | |'
            echo '|---|---|'
            echo "| Spec revision run against | \`$SPEC_VERSION\` |"
            echo "| Newest published upstream | $newest_cell |"
            echo "| New revision(s) this run | $new_cell |"
            echo "| Harness in use | \`$HARNESS_VERSION\` |"
            echo "| Newer harness available | $harness_cell |"
            echo '| product pass | `${{ steps.product.outcome }}` |'
            echo '| fixtures pass | `${{ steps.fixtures.outcome }}` |'
            echo '| backcompat pass | `${{ steps.backcompat.outcome }}` |'
            echo
            echo 'A failed pass means the suite reported a failure that is not in the matching'
            echo 'baseline, or a baseline entry that has started passing. Both need a human.'
            echo
            echo 'Full report: `docs/mcp-compliance.md`. Workflow run:'
            echo '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          } > "$body"
          existing=$(gh issue list --state open --search "$marker in:body" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then gh issue comment "$existing" --body-file "$body"
          else gh issue create --title "$title" --body-file "$body"; fi
