name: go | Build & Test

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/go-build-test.yml'
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'policy/**'
      - 'journeys/**'
      - '.goreleaser.yaml'
      - 'release-please-config.json'
      - 'packaging/**'
      - 'scripts/package-mcpb.sh'
      - 'scripts/mcpb-signature.py'
      - 'scripts/smoke-stdio.py'
      - '.github/scripts/**'
      - '.github/workflows/release.yml'
      - '.github/workflows/publish-registry.yml'
      - 'README.md'
      - 'docs/getting-started.md'
      - 'docs/permissions.md'

permissions:
  contents: read

jobs:
  build-test:
    name: '🧪 Build & Test (macOS 27)'
    # macOS-only by design: nearly every file carries
    # `//go:build darwin && (amd64 || arm64)`, and the SDK the engine is built on
    # is generated from the macOS 27 SDK. `xcode-27` is the GitHub-hosted image
    # that runs macOS 27 (arm64 only; there is no `macos-27` label). Note
    # step-security/harden-runner is not used here — it supports Linux runners
    # only; the security posture is SHA-pinned actions plus minimal permissions.
    runs-on: xcode-27
    timeout-minutes: 25

    steps:
      - name: Check Out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: 'go.mod'
          cache-dependency-path: 'go.sum'
          cache: true

      - name: Verify modules and tidiness
        run: |
          go mod download
          go mod verify
          go mod tidy -diff

      # mcp-server-core and agentweave-harness are developed in lockstep with
      # this repo, so working branches may point them at a local checkout. A
      # replace directive that reaches main would make releases build against
      # code no tag describes — refuse it here.
      - name: Refuse replace directives
        run: |
          if grep -E '^replace ' go.mod; then
            echo 'go.mod carries a replace directive; pin a published tag instead.' >&2
            exit 1
          fi

      - name: Build (arm64)
        run: go build ./...

      - name: Vet
        # unsafeptr is disabled: the journey recorder hands CGEventTapCreate a C
        # callback pointer minted by purego.NewCallback — the legitimate,
        # unavoidable idiom, which the checker cannot tell apart from misuse.
        # Every other vet analyzer stays on.
        run: go vet -unsafeptr=false ./...

      # The accessibility engine tests self-skip when the environment cannot
      # host them (hosted runners grant neither Accessibility nor Screen
      # Recording), so this job guarantees compilation plus the pure-logic
      # suites. -v keeps those skips visible rather than silent.
      - name: Test
        run: go test ./... -count=1 -v

      # The conformance host must build and test, and must never be in a
      # normal build: a released binary with an unauthenticated HTTP listener
      # is exactly what the stdio-only posture exists to prevent.
      - name: Conformance tag builds, and is absent from the product
        run: |
          go build -tags conformance ./...
          go test -tags conformance ./internal/macmcp/ -count=1
          if go run ./cmd/macos-mcp-server --help 2>&1 | grep -q conformance-serve; then
            echo 'conformance-serve leaked into an untagged build' >&2
            exit 1
          fi

      # The shipped policy examples must load against this build's signal set,
      # and the fixtures must decide as written. Pure logic; no device state.
      - name: Policy examples validate and fixtures pass
        run: |
          for p in policy/examples/*.json; do
            go run ./cmd/macos-mcp-server policy validate --policy-config "$p"
          done
          go run ./cmd/macos-mcp-server policy test policy/examples/tests/*.json

      - name: Journey examples validate
        run: |
          for j in journeys/examples/*.json; do
            go run ./cmd/macos-mcp-server journey validate "$j"
          done

      # What a hosted runner grants, for the record. Never gating: the grants
      # are a property of the machine, not the code.
      - name: Report TCC permissions on this runner
        run: go run ./cmd/macos-mcp-server permissions check --json || true

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.2
          install-only: true

      - name: Validate the distributable archive, cask and Claude bundle
        run: |
          set -euo pipefail
          npm install --global --no-audit --no-fund @anthropic-ai/mcpb@2.1.2
          goreleaser check
          goreleaser release --snapshot --clean --skip=sign,notarize,publish,sbom
          version=$(jq -r .version dist/metadata.json)
          binary=$(jq -r '.[] | select(.type == "Binary") | .path' dist/artifacts.json)
          test -n "$binary"
          test "$("$binary" --version)" = "macos-mcp-server version $version"
          python3 scripts/smoke-stdio.py "$binary" "$version"
          scripts/package-mcpb.sh "$binary" "$version" dist/snapshot.mcpb
          mcpb validate packaging/mcpb/manifest.json
          openssl req -x509 -newkey rsa:2048 -nodes -subj /CN=mcpb-ci-fixture \
            -keyout "$RUNNER_TEMP/mcpb-fixture.key" \
            -out "$RUNNER_TEMP/mcpb-fixture.pem" -days 1 >/dev/null 2>&1
          python3 scripts/mcpb-signature.py sign dist/snapshot.mcpb \
            --cert "$RUNNER_TEMP/mcpb-fixture.pem" --key "$RUNNER_TEMP/mcpb-fixture.key"
          python3 scripts/mcpb-signature.py verify dist/snapshot.mcpb \
            --cert "$RUNNER_TEMP/mcpb-fixture.pem"
          cp dist/snapshot.mcpb "$RUNNER_TEMP/tampered.mcpb"
          python3 -c 'import sys; from pathlib import Path; p = Path(sys.argv[1]); d = bytearray(p.read_bytes()); d[10] ^= 1; p.write_bytes(d)' \
            "$RUNNER_TEMP/tampered.mcpb"
          if python3 scripts/mcpb-signature.py verify "$RUNNER_TEMP/tampered.mcpb" \
              --cert "$RUNNER_TEMP/mcpb-fixture.pem"; then
            echo 'tampered MCPB passed signature verification' >&2
            exit 1
          fi
          .github/scripts/check-cask.sh dist/homebrew/Casks/macos-mcp-server.rb
